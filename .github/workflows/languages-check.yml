name: Languages compiler checks

on:
  push:
    branches:
      - languages
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler
        run: make -C underscore/compiler clean all
      - name: Run compiler regression tests
        run: make -C underscore/compiler test
